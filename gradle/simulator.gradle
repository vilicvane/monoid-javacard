task prepareSimulatorIdentity {
	def original = file('src/main/java/monoididentity/MonoidIdentityApplet.java')
	def adapted = file("${buildDir}/generated/simulator/monoididentity/MonoidIdentityApplet.java")
	inputs.file original
	outputs.file adapted

	doLast {
		def source = original.text
		def pattern = /MessageDigest\.ALG_SHA_256, true/
		if ((source =~ pattern).count != 1) {
			throw new GradleException('Unexpected simulator Identity digest shared-access match count')
		}

		// The simulator lacks shared digests and the four-argument key factory.
		adapted.parentFile.mkdirs()
		source = source.replaceAll(pattern, 'MessageDigest.ALG_SHA_256, false')
		pattern = /KeyBuilder\.ALG_TYPE_EC_FP_PUBLIC,\s*JCSystem\.MEMORY_TYPE_PERSISTENT,/
		if ((source =~ pattern).count != 1) {
			throw new GradleException('Unexpected simulator Identity key factory match count')
		}

		adapted.text = source.replaceAll(pattern, 'KeyBuilder.TYPE_EC_FP_PUBLIC,')
	}
}

task prepareSimulatorBundleExtension {
	def original = file('src/main/java/monoididentity/BundleExtension.java')
	def adapted = file("${buildDir}/generated/simulator/monoididentity/BundleExtension.java")
	inputs.file original
	outputs.file adapted

	doLast {
		def source = original.text
		def replacements = [
			[/KeyBuilder\.ALG_TYPE_EC_FP_PUBLIC,\s*JCSystem\.MEMORY_TYPE_PERSISTENT,/, 'KeyBuilder.TYPE_EC_FP_PUBLIC,'],
			[/MessageDigest\.ALG_SHA_256, true/, 'MessageDigest.ALG_SHA_256, false'],
			[/Signature\.ALG_ECDSA_SHA_256, true/, 'Signature.ALG_ECDSA_SHA_256, false']
		]
		// The simulator lacks the four-argument key factory and shared native engines.
		replacements.each { replacement ->
			if ((source =~ replacement[0]).count != 1) {
				throw new GradleException('Unexpected simulator BundleExtension factory match count')
			}
			source = source.replaceAll(replacement[0], replacement[1])
		}
		adapted.parentFile.mkdirs()
		adapted.text = source
	}
}

