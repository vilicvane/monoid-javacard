	}
}

task prepareSimulatorStorage {
	def original = file('src/main/java/monoid/Safe.java')
	def adapted = file("${buildDir}/generated/simulator/monoid/Safe.java")
	inputs.file original
	outputs.file adapted

	doLast {
		def source = original.text
		def pattern = /JCSystem\.getAvailableMemory\(availableMemory,\s*\(short\) 0,\s*JCSystem\.MEMORY_TYPE_PERSISTENT\);/
		if ((source =~ pattern).count != 1) {
			throw new GradleException('Unexpected simulator available-memory match count')
		}

		// The 32-bit overload is a no-op in jCardSim. Its short overload delegates to
		// SimulatorRuntime, allowing tests to supply memory reports without changing CAP code.
		source = source.replaceAll(pattern, '''availableMemory[0] = 0;
    availableMemory[1] = JCSystem.getAvailableMemory(JCSystem.MEMORY_TYPE_PERSISTENT);''')
		adapted.parentFile.mkdirs()
		adapted.text = source
	}
}

task prepareSimulatorOneShot {
	def original = file('src/main/java/monoid/OneShot.java')
	def adapted = file("${buildDir}/generated/simulator/monoid/OneShot.java")
	inputs.file original
	outputs.file adapted

	doLast {
		def source = original.text
		def pattern = /CryptoException\.throwIt\(CryptoException.NO_SUCH_ALGORITHM\);\s*return null;/
		if ((source =~ pattern).count != 1) {
			throw new GradleException('Unexpected simulator OneShot ECDSA fallback match count')
		}

		// Only host tests substitute DER ECDSA plus conversion for the missing PLAIN OneShot.
		adapted.parentFile.mkdirs()
		adapted.text = source.replaceAll(pattern, 'return main.SimulatorECDSA.sign(cipher, privateKey, digest);')
	}
}

task prepareSimulatorClientPIN {
	def original = file('src/main/java/monoidsecuritykey/ClientPIN.java')
	def adapted = file("${buildDir}/generated/simulator/monoidsecuritykey/ClientPIN.java")
	inputs.file original
	outputs.file adapted

	doLast {
		def source = original.text
		def replacements = [
			[/KeyBuilder\.ALG_TYPE_EC_FP_PRIVATE,\s*JCSystem\.MEMORY_TYPE_PERSISTENT,/, 'KeyBuilder.TYPE_EC_FP_PRIVATE,'],
			[/KeyBuilder\.ALG_TYPE_AES,\s*JCSystem\.MEMORY_TYPE_TRANSIENT_DESELECT,/, 'KeyBuilder.TYPE_AES_TRANSIENT_DESELECT,']
		]
		// jCardSim does not implement the four-argument key factory.
		replacements.each { replacement ->
			if ((source =~ replacement[0]).count != 1) {
				throw new GradleException('Unexpected simulator ClientPIN key-factory match count')
			}
			source = source.replaceAll(replacement[0], replacement[1])
		}
		// ByteContainer keeps stale trailing bytes when a generated EC scalar shrinks.
		// Its getS returns the logical length, so write that value back at fixed width.
		def generated = /keyAgreement\.genKeyPair\(\);/
		if ((source =~ generated).count != 1) {
			throw new GradleException('Unexpected simulator ClientPIN key-generation match count')
		}
		source = source.replaceAll(generated, '''keyAgreement.genKeyPair();
    ECPrivateKey privateKey = (ECPrivateKey) keyAgreement.getPrivate();
    byte[] scalar = new byte[32];
    short length = privateKey.getS(scalar, (short) 0);
    Util.arrayCopyNonAtomic(scalar, (short) 0, scalar, (short) (32 - length), length);
    Util.arrayFillNonAtomic(scalar, (short) 0, (short) (32 - length), (byte) 0);
    privateKey.setS(scalar, (short) 0, (short) scalar.length);''')
		adapted.parentFile.mkdirs()
		adapted.text = source
	}
}

task prepareSimulatorKeystore {
	def original = file('src/main/java/monoid/Keystore.java')
	def adapted = file("${buildDir}/generated/simulator/monoid/Keystore.java")
	inputs.file original
	outputs.file adapted

	doLast {
		def source = original.text
		def factory = /Signature\.getInstance\(\s*MessageDigest\.ALG_SHA_256,\s*Signature\.SIG_CIPHER_ECDSA_PLAIN,\s*Cipher\.PAD_NULL,\s*true\s*\)/
		def signing = /monoid001Signer\.signPreComputedHash\(/
		if ((source =~ factory).count != 1 || (source =~ signing).count != 1) {
			throw new GradleException('Unexpected simulator Keystore ECDSA adaptation match count')
		}

		// The simulator has no shared PLAIN factory. Preserve engine reuse and init, adapting
		// only the native format through the existing host-only DER-to-PLAIN helper.
		source = source.replaceAll(factory, 'Signature.getInstance(Signature.ALG_ECDSA_SHA_256, false)')
		source = source.replaceAll(signing, 'main.SimulatorECDSA.signPreComputedHash(monoid001Signer,')
		adapted.parentFile.mkdirs()
		adapted.text = source
	}
}

