// jCardSim 3.0.6 adaptations for the host JVM only. CAP uses src/main unchanged.
// Its default random generator starts with the same unseeded state for each instance.
test {
	systemProperty 'com.licel.jcardsim.randomdata.secure', '1'
}

run {
	systemProperty 'com.licel.jcardsim.randomdata.secure', '1'
}

def simulatorMathNames = ['CurveED25519', 'LibMath']

task prepareSimulatorMath {
	def originals = simulatorMathNames.collect { file("src/main/java/monoid/${it}.java") }
	def adapted = simulatorMathNames.collect { file("${buildDir}/generated/simulator/monoid/${it}.java") }
	inputs.files originals
	outputs.files adapted

	doLast {
		def replace = { String source, pattern, int count, replacement ->
			if ((source =~ pattern).count != count) {
				throw new GradleException("Unexpected simulator adaptation match count: ${pattern}")
			}
			source.replaceAll(pattern, replacement)
		}

		def curve = originals[0].text
		// The simulator lacks transient EC allocation and a 255-bit key capacity.
		curve = replace(curve, /KeyBuilder\.ALG_TYPE_EC_FP_PRIVATE,\s*JCSystem\.MEMORY_TYPE_TRANSIENT_DESELECT,/, 1,
			'KeyBuilder.TYPE_EC_FP_PRIVATE,')
		curve = replace(curve, /KEY_BITS = 255;/, 1, 'KEY_BITS = 256;')

		def math = originals[1].text
		// Reused RSA keys retain stale trailing bytes when a shorter exponent is set.
		math = replace(math, /byte\[\] buffer = sharedExponentiationBuffer;/, 1,
			'''sharedExponentiationKey = (RSAPrivateKey) KeyBuilder.buildKey(
        KeyBuilder.TYPE_RSA_PRIVATE, EXPONENT_BITS, false);
      byte[] buffer = sharedExponentiationBuffer;''')
		// The simulator consumes the numerical modulus length, ignoring leading zeroes.
		math = replace(math, /short modulusLength = EXPONENT_LENGTH;/, 1,
			'short modulusLength = length;')
		// Its RSA output also omits leading zeroes; restore the expected buffer width.
		math = replace(math, /if \(resultLength != modulusLength\) \{\s*CryptoException.throwIt\(CryptoException.ILLEGAL_USE\);\s*\}/, 1,
			'''if (resultLength != modulusLength) {
      Util.arrayCopyNonAtomic(buffer, (short) 0, buffer, (short) (modulusLength - resultLength), resultLength);
      Util.arrayFillNonAtomic(buffer, (short) 0, (short) (modulusLength - resultLength), (byte) 0);
    }''')

		[curve, math].eachWithIndex { source, index ->
			adapted[index].parentFile.mkdirs()
			adapted[index].text = source
		}
	}
}

task compileSimulatorMath(type: JavaCompile, dependsOn: [compileJava, prepareSimulatorMath]) {
	source 'src/simulator/java'
	source(simulatorMathNames.collect {
		file("${buildDir}/generated/simulator/monoid/${it}.java")
	})
	classpath = sourceSets.main.output + sourceSets.main.compileClasspath
	destinationDir = file("${buildDir}/classes/java/simulator")
}

task prepareSimulatorCommunicationCipher {
	def original = file('src/main/java/monoidsafeidentity/CommunicationCipher.java')
	def adapted = file("${buildDir}/generated/simulator/monoidsafeidentity/CommunicationCipher.java")
	inputs.file original
	outputs.file adapted

	doLast {
		def replace = { String source, pattern, int count, replacement ->
			if ((source =~ pattern).count != count) {
				throw new GradleException("Unexpected simulator adaptation match count: ${pattern}")
			}

			source.replaceAll(pattern, replacement)
		}

		def source = original.text
		// The four-argument KeyBuilder overload is an unimplemented simulator stub.
		source = replace(source, /KeyBuilder\.ALG_TYPE_EC_FP_PRIVATE,\s*JCSystem\.MEMORY_TYPE_PERSISTENT,/, 1,
			'KeyBuilder.TYPE_EC_FP_PRIVATE,')
		source = replace(source, /KeyBuilder\.ALG_TYPE_AES,\s*JCSystem\.MEMORY_TYPE_TRANSIENT_RESET,/, 1,
			'KeyBuilder.TYPE_AES_TRANSIENT_RESET,')
		// Its digest factory rejects shared access; the simulator has no firewall.
		source = replace(source, /MessageDigest\.ALG_SHA_256, true/, 1,
			'MessageDigest.ALG_SHA_256, false')

		adapted.parentFile.mkdirs()
		adapted.text = source
	}
}

task prepareSimulatorAESGcmCipher {
	def packages = ['monoidsafeidentity', 'monoidsafe']
	def originals = packages.collect { file("src/main/java/${it}/AESGcmCipher.java") }
	def adapted = packages.collect { file("${buildDir}/generated/simulator/${it}/AESGcmCipher.java") }
	inputs.files originals
	outputs.files adapted

	doLast {
		originals.eachWithIndex { original, index ->
			def source = original.text
			def pattern = /Cipher\.ALG_AES_BLOCK_128_ECB_NOPAD, true/
			if ((source =~ pattern).count != 1) {
				throw new GradleException('Unexpected simulator AES shared-access match count')
			}

			// Keep software GCM unchanged; only the native factory needs a host adaptation.
			adapted[index].parentFile.mkdirs()
			adapted[index].text = source.replaceAll(pattern, 'Cipher.ALG_AES_BLOCK_128_ECB_NOPAD, false')
		}
	}
}

task prepareSimulatorItemCipher {
	def original = file('src/main/java/monoidsafe/ItemCipher.java')
	def adapted = file("${buildDir}/generated/simulator/monoidsafe/ItemCipher.java")
	inputs.file original
	outputs.file adapted

	doLast {
		def replace = { String source, pattern, replacement ->
			if ((source =~ pattern).count != 1) {
				throw new GradleException("Unexpected simulator ItemCipher match count: ${pattern}")
			}

			source.replaceAll(pattern, replacement)
		}

		def source = original.text
		source = replace(source, /KeyBuilder\.ALG_TYPE_AES,\s*JCSystem\.MEMORY_TYPE_TRANSIENT_RESET,/,
			'KeyBuilder.TYPE_AES_TRANSIENT_RESET,')
		source = replace(source, /MessageDigest\.ALG_SHA_256, true/,
			'MessageDigest.ALG_SHA_256, false')

		adapted.parentFile.mkdirs()
		adapted.text = source
	}
}

task prepareSimulatorHMACSha512 {
	def original = file('src/main/java/monoid/LibHMACSha512.java')
	def adapted = file("${buildDir}/generated/simulator/monoid/LibHMACSha512.java")
	inputs.file original
	outputs.file adapted

	doLast {
		def source = original.text
		def pattern = /MessageDigest\.ALG_SHA_512, true/
		if ((source =~ pattern).count != 1) {
			throw new GradleException('Unexpected simulator HMAC digest shared-access match count')
		}

		// The simulator rejects shared digest factories and does not model the firewall.
		adapted.parentFile.mkdirs()
		adapted.text = source.replaceAll(pattern, 'MessageDigest.ALG_SHA_512, false')
	}
}

task prepareSimulatorStorage {
	def original = file('src/main/java/monoidsafe/MonoidSafeApplet.java')
	def adapted = file("${buildDir}/generated/simulator/monoidsafe/MonoidSafeApplet.java")
	inputs.file original
	outputs.file adapted

	doLast {
		def source = original.text
		def pattern = /JCSystem\.getAvailableMemory\(availableMemory,\s*\(short\) 0,\s*JCSystem\.MEMORY_TYPE_PERSISTENT\);/
		if ((source =~ pattern).count != 1) {
			throw new GradleException('Unexpected simulator available-memory match count')
		}

		// The 32-bit overload is a no-op in jCardSim. Its short overload delegates to
		// SimulatorRuntime, allowing tests to supply memory reports without changing CAP code.
		source = source.replaceAll(pattern, '''availableMemory[0] = 0;
    availableMemory[1] = JCSystem.getAvailableMemory(JCSystem.MEMORY_TYPE_PERSISTENT);''')
		adapted.parentFile.mkdirs()
		adapted.text = source
	}
}

compileSimulatorMath {
	dependsOn prepareSimulatorCommunicationCipher, prepareSimulatorAESGcmCipher, prepareSimulatorItemCipher, prepareSimulatorHMACSha512, prepareSimulatorStorage
	source file("${buildDir}/generated/simulator/monoid/LibHMACSha512.java")
	source file("${buildDir}/generated/simulator/monoidsafeidentity/CommunicationCipher.java")
	source file("${buildDir}/generated/simulator/monoidsafeidentity/AESGcmCipher.java")
	source file("${buildDir}/generated/simulator/monoidsafe/AESGcmCipher.java")
	source file("${buildDir}/generated/simulator/monoidsafe/ItemCipher.java")
	source file("${buildDir}/generated/simulator/monoidsafe/MonoidSafeApplet.java")
}
